<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Prefab Market</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<a href="index.html">← Back</a>

<h1 id="server-name">Server</h1>

<div class="info">
    Version: 0.0.1<br>
    Test version - loading JSON data.
</div>

<div id="content">
    Loading...
</div>


<script>

const params = new URLSearchParams(window.location.search);

const server = params.get("server");


document.getElementById("server-name").textContent =
    server ? server : "Unknown server";


if (server)
{
    loadData(server + ".json");
}


async function loadData(file)
{
    try
    {
        const response = await fetch(file);

        if (!response.ok)
            throw new Error("File not found");

        const data = await response.json();

        showData(data);
    }
    catch(error)
    {
        document.getElementById("content").innerHTML =
            "Error loading data: " + error;
    }
}


function showData(data)
{
    let html = "";

    html += "<h2>Update: " + data.UpdateDate + "</h2>";

    html += "<ul>";

for (const item of data.Items)
{
    html += "<div class='item'>";

    html += "<div>";
    html += item.Name;
    html += " | GTN: " + item.GtnPrice;
    html += " | Craft L1: " + item.CraftLvl1;
    html += " | Craft L3: " + item.CraftLvl3;
    html += "</div>";

    if (item.Log)
    {
        html += "<pre class='log'>";
        html += item.Log;
        html += "</pre>";
    }

    html += "</div>";
}
    document.getElementById("content").innerHTML = html;
}

</script>

</body>
</html>
